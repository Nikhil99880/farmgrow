<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- TopAppBar -->
<header class="bg-white w-full top-0 sticky border-b border-outline-variant/30 flex items-center justify-between px-margin-mobile h-touch-target-min z-50">
  <div class="flex items-center gap-3">
    <span class="material-symbols-outlined text-primary">agriculture</span>
    <h1 class="text-headline-sm font-headline-sm text-primary truncate">Kisan Setu | किसान सेतु</h1>
  </div>
  <button aria-label="Go back" class="text-primary h-touch-target-min w-touch-target-min flex items-center justify-center rounded-full hover:bg-surface-container focus:outline-none">
    <span class="material-symbols-outlined">arrow_back</span>
  </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow p-margin-mobile pb-32">
<!-- Welcome Header -->
<section class="mb-stack-gap-lg pt-4 text-center sm:text-left">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Farmer Registration<br>किसान पंजीकरण</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your basic details to start<br>शुरू करने के लिए अपना विवरण दर्ज करें</p>
</section>
<!-- Registration Form -->
<form class="space-y-stack-gap-md max-w-2xl mx-auto sm:mx-0">
<!-- Input: Full Name -->
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-unit" for="fullName">
                    Full Name <span class="font-body-md text-body-md text-on-surface-variant ml-1">/ पूरा नाम</span>
</label>
<input class="min-h-[56px] px-4 py-3 bg-surface-container-low border-2 border-outline-variant rounded-DEFAULT focus:border-secondary-container focus:ring-0 font-body-lg text-body-lg text-on-surface transition-colors placeholder:text-outline" id="fullName" name="fullName" placeholder="e.g., Ramesh Singh" required="" type="text">
</div>
<!-- Input: Farmer ID -->
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-unit" for="farmerId">
                    Farmer ID <span class="font-body-md text-body-md text-on-surface-variant ml-1">/ किसान आईडी</span>
</label>
<input class="min-h-[56px] px-4 py-3 bg-surface-container-low border-2 border-outline-variant rounded-DEFAULT focus:border-secondary-container focus:ring-0 font-body-lg text-body-lg text-on-surface transition-colors placeholder:text-outline" id="farmerId" name="farmerId" placeholder="e.g., PB-10492" type="text">
<p class="font-label-md text-label-md text-on-surface-variant mt-1">Leave blank if not registered yet</p>
</div>
<!-- Input: Mobile Number -->
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-unit" for="mobile">
                    Mobile Number <span class="font-body-md text-body-md text-on-surface-variant ml-1">/ मोबाइल नंबर</span>
</label>
<div class="relative flex">
<span class="inline-flex items-center px-4 bg-surface-container border-2 border-r-0 border-outline-variant rounded-l-DEFAULT font-body-lg text-body-lg text-on-surface-variant min-h-[56px]">
                        +91
                    </span>
<input class="flex-1 min-h-[56px] px-4 py-3 bg-surface-container-low border-2 border-outline-variant rounded-r-DEFAULT focus:border-secondary-container focus:ring-0 font-body-lg text-body-lg text-on-surface transition-colors placeholder:text-outline" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="9876543210" required="" type="tel">
</div>
</div>
<!-- Input: Village/District -->
<div class="flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface mb-unit" for="location">
                    Village or District <span class="font-body-md text-body-md text-on-surface-variant ml-1">/ गांव या जिला</span>
</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">location_on</span>
</span>
<input class="w-full min-h-[56px] pl-12 pr-4 py-3 bg-surface-container-low border-2 border-outline-variant rounded-DEFAULT focus:border-secondary-container focus:ring-0 font-body-lg text-body-lg text-on-surface transition-colors placeholder:text-outline" id="location" name="location" placeholder="e.g., Khanna, Punjab" required="" type="text">
</div>
</div>
<!-- Decorative Visual (Map) -->
<div class="mt-stack-gap-lg rounded-DEFAULT overflow-hidden border-2 border-outline-variant h-48 relative">
<img class="w-full h-full object-cover" data-alt="A stylized, flat vector illustration of an agricultural map showing rural farm plots in Punjab, India. High contrast, clean modern corporate style using emerald greens, stark whites, and yellow accents. Minimalist representation of fields and a location pin. Bright, flat lighting." data-location="Punjab" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBw_tPOrtBAgJREKkYxW3ohnvhxbl61S8GClcj4rZ1SZCKOHDBJw-SIATY8Vn8up8kZ_C2bjcY7C5flqmxtijKLpF973aVOPotgyT88q5U2_hULdd52o8kZGpJXXqJGELlBGGtMFStDJCkey2bMwuPw2BsJQRbkB3fs8pu05PPwzPE3SDW5XGdtgUjoHEo-Mhj7VpjXhq6LA6KKfV9CvqqtgP_DA-y7L3Q7M5kw8Mf4I3H9B_6Td8_H">
<div class="absolute inset-0 bg-primary/10 mix-blend-multiply"></div>
</div>
<div class="pt-4">
  <button type="submit" class="w-full min-h-touch-target-min bg-primary text-on-primary font-label-lg rounded-lg flex flex-col items-center justify-center active:scale-[0.98] transition-all shadow-md">
    <span class="">Register &amp; Continue</span>
    <span class="text-[12px] opacity-90">पंजीकरण करें और जारी रखें</span>
  </button>
</div></form>
</main>
<!-- Bottom Fixed Action Bar for Registration -->
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-outline-variant/30 px-2 py-2 flex justify-around items-center z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
  <a href="#" class="flex flex-col items-center gap-1 text-primary">
    <span class="material-symbols-outlined">home</span>
    <span class="text-[10px] font-label-md">Home</span>
  </a>
  <a href="#" class="flex flex-col items-center gap-1 text-on-surface-variant">
    <span class="material-symbols-outlined">local_shipping</span>
    <span class="text-[10px] font-label-md">Track</span>
  </a>
  <a href="#" class="flex flex-col items-center gap-1 text-on-surface-variant">
    <span class="material-symbols-outlined">location_on</span>
    <span class="text-[10px] font-label-md">Mandis</span>
  </a>
  <a href="#" class="flex flex-col items-center gap-1 text-on-surface-variant">
    <span class="material-symbols-outlined">high_quality</span>
    <span class="text-[10px] font-label-md">Quality</span>
  </a>
  <a href="#" class="flex flex-col items-center gap-1 text-on-surface-variant">
    <span class="material-symbols-outlined">payments</span>
    <span class="text-[10px] font-label-md">Payments</span>
  </a>
</nav>


</body></html>
